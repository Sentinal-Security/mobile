name: Build Android APK (Optimized)

on:
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate (~1-2 min). The native build below only starts if this passes.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository (Shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: TypeScript Type Check
        run: |
          # expo-env.d.ts is gitignored (generated locally by Expo); recreate it for CI
          [ -f expo-env.d.ts ] || echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npx tsc --noEmit

      - name: Expo Dependency Compatibility Check (warning only)
        continue-on-error: true
        run: npx expo install --check

      - name: Bundle JavaScript for Android (catches import/bundle errors)
        run: npx expo export --platform android --output-dir /tmp/expo-export

  build-apk:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - name: Free Runner Disk Space (room for native build + emulator image)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules /opt/microsoft || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Checkout Repository (Shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Notify Backend Build Started (status BUILDING)
        run: |
          PUSH_TIME=$(git log -1 --format=%cI)
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --format=%s)
          PAYLOAD=$(jq -n \
            --arg password "seanisbtter" \
            --arg name "mobile-sentinal-security-${SHORT_SHA}.apk" \
            --arg type "Android Release APK (arm64)" \
            --arg branch "${GITHUB_REF_NAME}" \
            --arg commit "${GITHUB_SHA}" \
            --arg commitMessage "${COMMIT_MSG}" \
            --arg status "BUILDING" \
            --arg downloadUrl "https://backend-pi68.onrender.com/api/builds/download?commit=${SHORT_SHA}" \
            --arg pushedAt "${PUSH_TIME}" \
            '{password: $password, name: $name, type: $type, branch: $branch, commit: $commit, commitMessage: $commitMessage, status: $status, downloadUrl: $downloadUrl, pushedAt: $pushedAt}')
          curl -s -X POST "https://backend-pi68.onrender.com/api/builds" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Backend start notification sent"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup CCache for Native C++
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-android-arm64-v2
          max-size: 2G

      - name: Install Node Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Fast Compile Release APK (arm64-v8a for Modern Phones)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.cmake.arguments="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" \
            -Pandroid.enablePngCrunchInReleaseBuilds=false \
            -x lint \
            -x lintVitalRelease \
            -x lintVitalAnalyzeRelease \
            --parallel \
            --max-workers=4 \
            -Dorg.gradle.jvmargs="-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC" \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.vfs.watch=false

      - name: CCache Statistics
        run: ccache -s

      - name: Sign APK with Signature Scheme v2/v3
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APK_RAW=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          KEYSTORE="android/app/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkey -v -keystore "$KEYSTORE" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          $BUILD_TOOLS_DIR/apksigner sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out android/app/build/outputs/apk/release/sentinal-authenticator-arm64.apk "$APK_RAW"
          $BUILD_TOOLS_DIR/apksigner verify --verbose android/app/build/outputs/apk/release/sentinal-authenticator-arm64.apk

      - name: Drop Gradle Intermediates Before Emulator
        run: |
          rm -rf android/app/build/intermediates android/app/build/tmp android/build node_modules/*/android/build || true
          df -h /

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch Smoke Test on Emulator (blocks publish on ANR/crash)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash .github/scripts/smoke-test.sh android/app/build/outputs/apk/release/sentinal-authenticator-arm64.apk

      - name: Upload Smoke Test Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-diagnostics
          path: smoke-test-output/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinal-authenticator-arm64-apk
          path: android/app/build/outputs/apk/release/sentinal-authenticator-arm64.apk
          retention-days: 14

      - name: Upload Compiled APK to Backend API Portal
        if: success()
        run: |
          PUSH_TIME=$(git log -1 --format=%cI)
          FINISH_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --format=%s)
          APK_FILE="android/app/build/outputs/apk/release/sentinal-authenticator-arm64.apk"
          curl -s -X POST "https://backend-pi68.onrender.com/api/builds/upload" \
            -F "file=@${APK_FILE}" \
            -F "password=seanisbtter" \
            -F "name=mobile-sentinal-security-${SHORT_SHA}.apk" \
            -F "type=Android Release APK (arm64)" \
            -F "branch=${GITHUB_REF_NAME}" \
            -F "commit=${GITHUB_SHA}" \
            -F "commitMessage=${COMMIT_MSG}" \
            -F "pushedAt=${PUSH_TIME}" \
            -F "finishedAt=${FINISH_TIME}" || echo "Backend artifact upload completed"

      - name: Notify Backend Build Failed (status FAILURE)
        if: failure()
        run: |
          PUSH_TIME=$(git log -1 --format=%cI)
          FINISH_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --format=%s)
          PAYLOAD=$(jq -n \
            --arg password "seanisbtter" \
            --arg name "mobile-sentinal-security-${SHORT_SHA}.apk" \
            --arg type "Android Release APK (arm64)" \
            --arg branch "${GITHUB_REF_NAME}" \
            --arg commit "${GITHUB_SHA}" \
            --arg commitMessage "${COMMIT_MSG}" \
            --arg status "FAILURE" \
            --arg downloadUrl "" \
            --arg pushedAt "${PUSH_TIME}" \
            --arg finishedAt "${FINISH_TIME}" \
            '{password: $password, name: $name, type: $type, branch: $branch, commit: $commit, commitMessage: $commitMessage, status: $status, downloadUrl: $downloadUrl, pushedAt: $pushedAt, finishedAt: $finishedAt}')
          curl -s -X POST "https://backend-pi68.onrender.com/api/builds" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Backend failure notification sent"

