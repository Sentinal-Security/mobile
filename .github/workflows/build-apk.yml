name: Build Android APK (Optimized)

on:
  push:
    branches: [ development, main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.git-town.toml'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (Shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup CCache for Native C++
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-android-arm64-v1
          max-size: 2G

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Fast Compile Release APK (arm64-v8a for Modern Phones)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -x lint \
            -x lintVitalRelease \
            -x lintVitalAnalyzeRelease \
            --parallel \
            --max-workers=4 \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            -Dorg.gradle.caching=true \
            --no-daemon

      - name: Sign APK with Signature Scheme v2/v3
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APK_RAW=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          KEYSTORE="android/app/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkey -v -keystore "$KEYSTORE" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          $BUILD_TOOLS_DIR/apksigner sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out android/app/build/outputs/apk/release/sentinal-authenticator-arm64.apk "$APK_RAW"
          $BUILD_TOOLS_DIR/apksigner verify --verbose android/app/build/outputs/apk/release/sentinal-authenticator-arm64.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinal-authenticator-arm64-apk
          path: android/app/build/outputs/apk/release/sentinal-authenticator-arm64.apk
          retention-days: 14

      - name: Register Build with Downloads Portal (/dw)
        if: success()
        run: |
          PUSH_TIME=$(git log -1 --format=%cI)
          FINISH_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          curl -s -X POST "https://backend-pi68.onrender.com/api/builds" \
            -H "Content-Type: application/json" \
            -d "{
              \"password\": \"seanisbtter\",
              \"name\": \"sentinal-authenticator-arm64.apk\",
              \"type\": \"Android Release APK (arm64)\",
              \"branch\": \"${GITHUB_REF_NAME}\",
              \"commit\": \"${GITHUB_SHA}\",
              \"downloadUrl\": \"https://backend-pi68.onrender.com/api/builds/download\",
              \"pushedAt\": \"${PUSH_TIME}\",
              \"finishedAt\": \"${FINISH_TIME}\",
              \"finishedCompileAt\": \"${FINISH_TIME}\"
            }" || echo "Backend registration ping sent"

